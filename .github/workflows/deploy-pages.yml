name: Deploy SafarRakshak to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build React and Tailwind application
        run: npm run build
      - name: Verify built website
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html trip-area.html navigator.html; do
            test -s "dist/$file" || { echo "::error::Missing dist/$file"; exit 1; }
          done
          touch dist/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: safarrakshak-site
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: safarrakshak-site
          path: dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
