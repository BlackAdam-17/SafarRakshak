name: Deploy SafarRakshak to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and prepare static website
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            index.html
            trip-area.html
            app.js
            account-ui.js
            trip-area.js
            styles.css
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required website file is missing or empty: $file"
              exit 1
            fi
          done

          mkdir -p _site
          cp "${required_files[@]}" _site/
          touch _site/.nojekyll

          echo "Website files prepared:"
          find _site -maxdepth 1 -type f -printf '%f\\n' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
