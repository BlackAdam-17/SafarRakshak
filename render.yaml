services:
  - type: web
    name: safarrakshak-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm run server:start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://blackadam-17.github.io
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
